name: Ship proximity alert

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay runs a few minutes)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification only"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ship-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install websockets

      - name: Check ship distance
        run: python -u proximity_alert.py
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NOTIFY: ${{ inputs.test }}
          THRESHOLD_NM: ${{ vars.THRESHOLD_NM || '25' }}

      - name: Save positions and state
        run: |
          git config user.name "ship-alert-bot"
          git config user.email "ship-alert-bot@users.noreply.github.com"
          git add state.json positions.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update ship positions" && git pull --rebase -q && git push)
